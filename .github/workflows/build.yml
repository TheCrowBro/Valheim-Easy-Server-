name: Build and test

# Every build of the main branch that passes becomes a release, build-N, and
# installed copies update themselves to a higher N. N is this workflow's run
# number, which starts again at 1 if this file is renamed: don't rename it.
#
# Actions are pinned to exact commits, since the release job can publish
# what every installed copy runs.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet (Linux, Windows and Mac code)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Check the control panel scripts
        run: |
          for f in internal/web/ui/assets/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "Syntax error in $f"; exit 1; }
          done
      - name: Known vulnerabilities in Go and the libraries used
        run: |
          # Built with the project's Go, so it can read the code; then run
          # for this computer and for the Windows build.
          GOTOOLCHAIN=$(go env GOVERSION) GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$RUNNER_TEMP/bin/govulncheck" ./...
          GOOS=windows "$RUNNER_TEMP/bin/govulncheck" ./...
          GOOS=darwin "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: Build the waker for the JetKVM (ARMv7 Linux), so the tests check it too
        run: |
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=test" -o waker.tmp ./cmd/valheim-waker
          gzip -9 -c waker.tmp > internal/jetkvm/dist/valheim-waker-armv7.gz
          rm waker.tmp
          ls -l internal/jetkvm/dist/
      - name: Test
        run: go test -race ./...

  windows:
    name: Tests and app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Windows features (Ctrl+C to the server, CPU/GPU/RAM counters, power)
        run: go test -v -count=1 ./internal/platform/
      - name: All tests (a stand-in Valheim server is started, saved and stopped)
        run: go test -count=1 ./...
      - name: Add the icon and version details
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64
      - name: Version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { "build-$env:RUN_NUMBER" }
          "VES_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The app carries the waker and puts it on the JetKVM. Both have the
      # same version, which is how the app knows the JetKVM's copy is current.
      - name: Build the waker for the JetKVM (ARMv7 Linux)
        shell: bash
        run: |
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VES_VERSION" -o waker.tmp ./cmd/valheim-waker
          gzip -9 -c waker.tmp > internal/jetkvm/dist/valheim-waker-armv7.gz
          rm waker.tmp
          ls -l internal/jetkvm/dist/
      - name: Build ValheimEasyServer.exe
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$env:VES_VERSION -X main.build=$env:RUN_NUMBER" -o dist/ValheimEasyServer.exe .
      - name: Smoke test the app
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "ves-smoke"
          $p = Start-Process -FilePath dist\ValheimEasyServer.exe -ArgumentList "--no-window", "--data", $data, "--port", "18456" -PassThru
          Start-Sleep -Seconds 6
          try {
            $status = Invoke-RestMethod http://127.0.0.1:18456/api/status
            Write-Host "Server state: $($status.state)"
            if ($status.state -ne "not_installed") { throw "Unexpected state $($status.state)." }
            $page = (Invoke-WebRequest http://127.0.0.1:18456/ -UseBasicParsing).Content
            if ($page -notmatch "Valheim Easy Server") { throw "The control panel page didn't load." }
            if ($p.HasExited) { throw "The app exited." }
          } finally {
            Get-Content (Join-Path $data "logs\app.log") -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Self-update test (an older copy updates itself to this build, then goes back from a build that doesn't start)
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = "Stop"
          $n = [int]$env:RUN_NUMBER
          $root = Join-Path $env:RUNNER_TEMP "ves-update"
          $site = Join-Path $root "site"
          $data = Join-Path $root "data"
          $exe = Join-Path $root "app\ValheimEasyServer.exe"
          New-Item -ItemType Directory -Force $site, $data, (Split-Path $exe) | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -X main.version=build-1 -X main.build=1" -o $exe .
          if ($LASTEXITCODE -ne 0) { throw "Couldn't build the older copy." }

          # A stand-in for GitHub's releases list and downloads.
          function Publish([int]$build, [string]$program) {
            $tag = "build-$build"
            $dir = Join-Path $site $tag
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $program (Join-Path $dir "ValheimEasyServer.exe")
            $hash = (Get-FileHash (Join-Path $dir "ValheimEasyServer.exe") -Algorithm SHA256).Hash.ToLower()
            Set-Content -NoNewline -Path (Join-Path $dir "ValheimEasyServer.exe.sha256") -Value "$hash  ValheimEasyServer.exe"
            $assets = "ValheimEasyServer.exe", "ValheimEasyServer.exe.sha256" | ForEach-Object { @{ name = $_; browser_download_url = "http://127.0.0.1:18500/$tag/$_" } }
            $api = Join-Path $site "repos/TheCrowBro/Valheim-Easy-Server-"
            New-Item -ItemType Directory -Force $api | Out-Null
            # The repository itself (Python serves a folder's index.html).
            ConvertTo-Json -InputObject @{ id = 1430331409; full_name = "TheCrowBro/Valheim-Easy-Server-" } | Set-Content (Join-Path $api "index.html")
            ConvertTo-Json -InputObject @(@{ tag_name = $tag; body = "Test build $build"; assets = @($assets) }) -Depth 5 | Set-Content (Join-Path $api "releases")
          }
          function WaitFor([scriptblock]$cond, [string]$what) {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              $s = try { Invoke-RestMethod http://127.0.0.1:18457/api/status -TimeoutSec 5 } catch { $null }
              if ($s -and (& $cond $s)) { return $s }
              Start-Sleep -Seconds 2
            }
            throw "Timed out waiting for $what."
          }
          function Update {
            Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18457/api/app/update -Headers @{ "X-VES" = "1" } -ContentType "application/json" -Body '{"install":true}' | Out-Null
          }

          function Answers([string]$url) {
            try { Invoke-WebRequest $url -TimeoutSec 5 | Out-Null; $true } catch { $false }
          }

          $web = Start-Process -FilePath python -ArgumentList "-m", "http.server", "18500", "--bind", "127.0.0.1", "--directory", $site -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while (-not (Answers "http://127.0.0.1:18500/")) {
              if ($web.HasExited -or (Get-Date) -gt $deadline) { throw "The stand-in GitHub didn't start." }
              Start-Sleep -Milliseconds 500
            }
            Publish $n "dist\ValheimEasyServer.exe"
            Start-Process -FilePath $exe -ArgumentList "--no-window", "--data", $data, "--port", "18457", "--dev-fake-github", "http://127.0.0.1:18500"
            WaitFor { param($s) $s.app.build -eq 1 } "build 1 to start" | Out-Null
            Update
            $s = WaitFor { param($s) $s.app.build -eq $n } "the update to build $n"
            if (-not ($s.activity | Where-Object { $_.text -like "The app was updated to build $n*" })) { throw "The activity list doesn't mention the update." }
            if (-not (Test-Path "$exe.old")) { throw "The previous version wasn't kept." }
            Write-Host "Build 1 updated itself to build $n."

            # whoami.exe stands in for a build that doesn't start.
            Publish ($n + 1) "$env:SystemRoot\System32\whoami.exe"
            Update
            WaitFor { param($s) $s.app.build -eq $n -and $s.app.failed -eq ($n + 1) } "the app to go back to build $n" | Out-Null
            Write-Host "Build $($n + 1) didn't start, and the app went back to build $n."
          } finally {
            Get-Content (Join-Path $data "logs\app.log") -ErrorAction SilentlyContinue
            Get-Process ValheimEasyServer -ErrorAction SilentlyContinue | Stop-Process -Force
            Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Package
        shell: pwsh
        run: Copy-Item "docs/READ-ME-FIRST.txt" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ValheimEasyServer-windows
          path: dist/
          if-no-files-found: error

  mac:
    name: Tests and app (Mac)
    runs-on: macos-15-intel # an Intel Mac, like a 2013 Mac Pro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Mac features (processes, usage readings, power, network, login item)
        run: go test -v -count=1 ./internal/platform/
      - name: All tests (a stand-in Valheim server is started, saved and stopped)
        run: go test -count=1 ./...
      - name: Version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then v="$REF_NAME"; else v="build-$RUN_NUMBER"; fi
          echo "VES_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the mod loader for macOS 11 and later (UnityDoorstop)
        run: .github/scripts/build-doorstop.sh
      - name: Build the waker for the JetKVM (ARMv7 Linux)
        run: |
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VES_VERSION" -o waker.tmp ./cmd/valheim-waker
          gzip -9 -c waker.tmp > internal/jetkvm/dist/valheim-waker-armv7.gz
          rm waker.tmp
      - name: Build the app (one program for Intel and Apple silicon)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VES_VERSION -X main.build=$RUN_NUMBER" -o "ves-$arch" .
          done
          lipo -create -output ValheimEasyServer-mac ves-amd64 ves-arm64
          lipo -info ValheimEasyServer-mac
          # A 2013 Mac Pro gets macOS 12 Monterey at most, and each Go release
          # raises the oldest macOS its programs start on (Go 1.27 needs 13).
          for arch in x86_64 arm64; do
            minos=$(vtool -arch "$arch" -show-build ValheimEasyServer-mac | awk '$1 == "minos" {print $2}')
            echo "$arch: starts on macOS $minos and newer"
            if [ -z "$minos" ] || [ "${minos%%.*}" -gt 12 ]; then
              echo "::error::The Mac app would need macOS $minos, but a 2013 Mac Pro has macOS 12 at most. Build it with Go 1.26 (go.mod)."
              exit 1
            fi
          done
      - name: Make the Mac app
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          folder="dist-mac/Valheim Easy Server"
          app="$folder/Valheim Easy Server.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp ValheimEasyServer-mac "$app/Contents/MacOS/ValheimEasyServer"
          sed "s/BUILD_NUMBER/$RUN_NUMBER/g" macapp/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size internal/web/ui/assets/icon-512.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) internal/web/ui/assets/icon-512.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          cp internal/mods/dist/UnityDoorstop-LICENSE.txt "$app/Contents/Resources/"
          cp docs/READ-ME-FIRST-Mac.txt "$folder/READ-ME-FIRST.txt"
          ditto -c -k --keepParent "$folder" dist-mac/ValheimEasyServer-mac.zip
          cp ValheimEasyServer-mac dist-mac/
          ls -la dist-mac "$app/Contents/MacOS"
      - name: Smoke test the Mac app (opened from Finder, it carries on in the background)
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/ves-smoke"
          exe="dist-mac/Valheim Easy Server/Valheim Easy Server.app/Contents/MacOS/ValheimEasyServer"
          "$exe" --no-window --data "$data" --port 18456 # returns once the background copy is started
          ok=""
          for i in $(seq 1 30); do
            if status=$(curl -fsS http://127.0.0.1:18456/api/status); then ok=1; break; fi
            sleep 1
          done
          cat "$data/logs/app.log" || true
          test -n "$ok"
          echo "$status" | grep -q '"state":"not_installed"'
          echo "$status" | grep -q '"platform":"darwin"'
          curl -fsS http://127.0.0.1:18456/ | grep -q "Valheim Easy Server"
          pkill -f -- "--data $data" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ValheimEasyServer-mac
          path: |
            dist-mac/ValheimEasyServer-mac.zip
            dist-mac/ValheimEasyServer-mac
          if-no-files-found: error

  release:
    name: Publish release
    # Every build of the main branch that passes the tests becomes a release
    # (build-N), which installed copies of the app update themselves to.
    # Version tags (v1.0) get a release too.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ValheimEasyServer-windows
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ValheimEasyServer-mac
          path: dist-mac
      - name: Zip, checksum and notes
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          (cd dist && zip -r ../ValheimEasyServer-windows.zip .)
          cp dist/ValheimEasyServer.exe dist-mac/ValheimEasyServer-mac.zip dist-mac/ValheimEasyServer-mac .
          sha256sum ValheimEasyServer.exe > ValheimEasyServer.exe.sha256
          sha256sum ValheimEasyServer-mac > ValheimEasyServer-mac.sha256
          # The notes are the commit message without its trailers; the app
          # shows their first line as what changed.
          { printf '%s\n' "$MESSAGE" | sed '/^Co-Authored-By:/d; /^Claude-Session:/d'; echo; echo "SHA-256 of ValheimEasyServer.exe: $(cut -d' ' -f1 ValheimEasyServer.exe.sha256)"; echo; echo "SHA-256 of ValheimEasyServer-mac (the Mac app's program): $(cut -d' ' -f1 ValheimEasyServer-mac.sha256)"; } > notes.md
      # With GitHub's own command-line tool, so no outside code handles the
      # files every installed copy will run.
      - name: Publish the build
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          tag="build-$RUN_NUMBER"
          files="ValheimEasyServer-windows.zip ValheimEasyServer.exe ValheimEasyServer.exe.sha256 ValheimEasyServer-mac.zip ValheimEasyServer-mac ValheimEasyServer-mac.sha256"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" $files --repo "$GITHUB_REPOSITORY" --clobber # a re-run
          else
            gh release create "$tag" $files --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Build $RUN_NUMBER" --notes-file notes.md --latest
          fi
      - name: Publish the version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ValheimEasyServer-windows.zip ValheimEasyServer.exe ValheimEasyServer.exe.sha256 ValheimEasyServer-mac.zip ValheimEasyServer-mac ValheimEasyServer-mac.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
